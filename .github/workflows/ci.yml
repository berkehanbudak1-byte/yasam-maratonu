name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax checks
        run: |
          for f in dunya/src/*.js tests/*.js tests/*.mjs; do node --check "$f"; done
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.json', 'utf8'))"

      - name: Run unit and smoke tests
        run: node --test tests/security.test.js tests/smoke.test.mjs tests/csp-and-syntax.test.mjs
